name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-electron:
    name: Electron Desktop
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # 注意：不走 npm run electron:build（其 pre 钩子会偷偷 bump 版本）。
      # 直接 vite build + electron-builder，且用 GitHub 官方源（Windows runner 在国外，npmmirror 反而慢）。
      - name: Install dependencies
        run: npm install --legacy-peer-deps
      - name: Build web
        run: npm run build
      - name: Build Electron Installer
        run: node node_modules/electron-builder/out/cli/cli.js --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
          draft: false
          prerelease: false
          generate_release_notes: true
